<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap the model sticker · Resolved v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C45F00;text-decoration:none}a:hover{color:#8A4300}
</style>
<style>
body{margin:0;min-height:100vh;background:#E9E2D4;display:flex;flex-direction:column;align-items:center;padding:56px 0 32px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
.proto-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-size:12px;color:#3D3830;background:#FFFFFFCC;border:1px solid #D4C8AC;border-radius:999px;padding:6px 12px;z-index:10;white-space:nowrap}
.proto-bar a{color:#C45F00;font-weight:600;text-decoration:none}
.phone{border-radius:32px;overflow:hidden;box-shadow:0 1px 0 #D4C8AC,0 20px 50px rgba(26,22,18,.18)}
@media (max-width:480px){body{padding:0;background:#FBF6EC}.phone{border-radius:0;box-shadow:none}.proto-bar{display:none}}
html.shot body{padding:0;align-items:flex-start;background:#FBF6EC}
html.shot .proto-bar{display:none}
html.shot .phone{border-radius:0;box-shadow:none}
</style>
<script>if (location.search.includes('shot')) document.documentElement.classList.add('shot');</script>
</head>
<body>
<div class="proto-bar">Resolved v2 · clickable prototype · <a href="screens.html">All screens</a></div>
<div class="phone"><div style="width: 390px; height: 844px; box-sizing: border-box; background: #14110E; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px">
    <a href="index.html" aria-label="Close" style="width: 44px; height: 44px; display: grid; place-items: center; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #D9D2C5">Sticker is usually inside the door</span>
    <span style="width: 44px"></span>
  </header>

  <section style="flex: 1; display: grid; place-items: center; padding: 0 32px">
    <div style="width: 300px; height: 190px; border-radius: 16px; border: 2px solid #FF9933; box-sizing: border-box; padding: 16px; background: #2A251F; display: flex; flex-direction: column; gap: 8px; position: relative">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #D9D2C5">MODEL STICKER PREVIEW</span>
      <span style="height: 10px; width: 70%; border-radius: 3px; background: #4A433A"></span>
      <span style="height: 10px; width: 55%; border-radius: 3px; background: #FF9933"></span>
      <span style="height: 10px; width: 80%; border-radius: 3px; background: #FF9933"></span>
      <span style="height: 10px; width: 45%; border-radius: 3px; background: #4A433A"></span>
      <span style="height: 10px; width: 60%; border-radius: 3px; background: #4A433A"></span>
      <span style="position: absolute; bottom: 12px; right: 14px; font-size: 11px; color: #FFB85C; font-weight: 600">Reading…</span>
    </div>
  </section>

  <section style="background: #FBF6EC; color: #1A1612; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 14px">
    <span style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Found your machine</h1>
      <span style="font-size: 13px; color: #6A625A">Check these. Tap any line to fix it.</span>
    </span>
    <dl style="margin: 0; display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DFCB">
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #F1EADB">
        <dt style="font-size: 12px; color: #6A625A">Brand</dt><dd style="margin: 0; font-size: 14px; font-weight: 600">LG</dd>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #F1EADB">
        <dt style="font-size: 12px; color: #6A625A">Type</dt><dd style="margin: 0; font-size: 14px; font-weight: 600">Front load washer · 8 kg</dd>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #F1EADB">
        <dt style="font-size: 12px; color: #6A625A">Model and serial</dt><dd style="margin: 0; font-size: 14px; font-weight: 600">[read from sticker]</dd>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px">
        <dt style="font-size: 12px; color: #6A625A">Purchase date</dt>
        <dd style="margin: 0"><button style="min-height: 32px; border: 1px dashed #C45F00; border-radius: 8px; background: transparent; padding: 0 10px; font-family: inherit; font-size: 13px; font-weight: 600; color: #C45F00">Add invoice</button></dd>
      </div>
    </dl>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
      <a href="scan.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D4C8AC; color: #1A1612; font-size: 14px; font-weight: 600">Retake</a>
      <a href="issue.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #C45F00; color: #FFFFFF; font-size: 15px; font-weight: 600">Looks right</a>
    </div>
  </section>
</div></div>
</body>
</html>
